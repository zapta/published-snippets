
[env:tang9k]
board = sipeed-tang-nano-9k
constraint-file = pinout-tang9k.cst
top-module = main
default-testbench = main_tb.v

yosys-extra-options =
  {semicolon} write_verilog {env-build}/yosys-synth.v

format-verible-options =
    --column_limit=100
    --indentation_spaces=2

nextpnr-extra-options =
    --seed 1008

gtkwave-extra-options =
    --rcvar=do_initial_zoom_fit 0
